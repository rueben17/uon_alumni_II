name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      # deploy.sh lives in this repo (not just on the VPS) so changes to
      # it are reviewable and versioned -- an unversioned copy is how a
      # stale feature-branch pointer sat unnoticed through a whole
      # night of "successful" deploys (2026-08-11 incident). Synced
      # fresh every run, overwriting whatever's currently on the box.
      - name: Sync deploy script to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.sh"
          target: "/home/armando_salazar"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /home/armando_salazar/deploy.sh

      # Compares what this run actually pushed against what's checked
      # out on the VPS afterward, and fails loudly on a mismatch instead
      # of a green checkmark that means nothing -- exactly the gap that
      # let a stale branch pointer deploy the same commit all night
      # while every run reported success.
      - name: Verify deployed commit matches
        if: always()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          DEPLOYED_SHA=$(ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}" \
            "cd /home/armando_salazar/webapps/uon_alumni_II && git rev-parse HEAD" 2>/dev/null || echo "unreachable")
          rm -f ~/.ssh/deploy_key

          {
            echo "### Deploy verification"
            echo "- Pushed commit: \`${{ github.sha }}\`"
            echo "- Running on VPS: \`$DEPLOYED_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
            echo "⚠️ MISMATCH — the VPS is not running the commit this workflow pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployed commit ($DEPLOYED_SHA) does not match pushed commit (${{ github.sha }})"
            exit 1
          fi
          echo "✅ Match." >> "$GITHUB_STEP_SUMMARY"
