<div{% if wrapper_class %} class="{{ wrapper_class }}"{% endif %}>
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}
        <p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <ul class="mt-2 space-y-1 text-sm text-red-600">
            {% for error in field.errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</div>
